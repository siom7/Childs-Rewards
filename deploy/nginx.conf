# Reverse proxy NGINX pour Points Famille.
# 1. Remplacer points.example.com par votre domaine (2 endroits)
# 2. Copier dans /etc/nginx/sites-available/childs-rewards puis :
#      ln -s /etc/nginx/sites-available/childs-rewards /etc/nginx/sites-enabled/
#      apt install certbot python3-certbot-nginx && certbot --nginx -d points.example.com
#      nginx -t && systemctl reload nginx
# Si NGINX tourne sur une autre machine que l'application, remplacer 127.0.0.1:8000
# par l'IP du container (et lancer install.sh avec CR_BIND=0.0.0.0).

server {
    listen 80;
    server_name points.example.com;
    # certbot ajoute ici la redirection vers HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name points.example.com;
    # ssl_certificate / ssl_certificate_key : ajoutés par certbot

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
